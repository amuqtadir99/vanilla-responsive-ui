<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; form-action 'self'; base-uri 'self'; object-src 'none'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Sign in — Acme Cloud</title>
  <meta name="description" content="Sign-in page template with accessible validation, password visibility toggle and remember-me option.">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f5f7fa" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#161a21" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="../../assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../../assets/css/tokens.css">
  <link rel="stylesheet" href="../../assets/css/base.css">
  <link rel="stylesheet" href="../../assets/css/components/button.css">
  <link rel="stylesheet" href="../../assets/css/components/header.css">
  <link rel="stylesheet" href="../../assets/css/components/form.css">
  <link rel="stylesheet" href="../../assets/css/components/feedback.css">
  <link rel="stylesheet" href="auth.css">
  <script type="module" src="../../assets/js/main.js"></script>
</head>
<body class="auth">
  <a class="skip-link" href="#main">Skip to main content</a>

  <header class="auth__header">
    <a class="brand" href="../landing-page/index.html">
      <span class="brand__mark"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2 2 7l10 5 10-5z"/><path d="m2 17 10 5 10-5M2 12l10 5 10-5"/></svg></span>
      Acme Cloud
    </a>
    <button type="button" class="btn btn--ghost btn--icon theme-toggle" data-theme-toggle aria-pressed="false" hidden>
      <svg class="icon theme-toggle__light" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      <svg class="icon theme-toggle__dark" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
      <span class="visually-hidden">Dark theme</span>
    </button>
  </header>

  <main class="auth__main" id="main" tabindex="-1">
    <div class="auth__card">
      <div class="stack stack--xs text-center">
        <h1 class="auth__title">Sign in to your account</h1>
        <p class="text-muted">Welcome back. Enter your details to continue.</p>
      </div>

      <form class="form" action="/account/sign-in" method="post" data-validate data-demo-submit="Signed in successfully (demo). Connect this form to your authentication endpoint.">
        <div class="field">
          <label class="field__label" for="signin-email">Email address</label>
          <input class="input" id="signin-email" name="email" type="email" autocomplete="username" inputmode="email" spellcheck="false" required aria-describedby="signin-email-error" data-error-required="Enter your email address.">
          <p class="field__error" id="signin-email-error"></p>
        </div>

        <div class="field">
          <div class="cluster cluster--between">
            <label class="field__label" for="signin-password">Password</label>
            <a class="text-sm" href="#main">Forgot password?</a>
          </div>
          <div class="input-group">
            <input class="input" id="signin-password" name="password" type="password" autocomplete="current-password" required aria-describedby="signin-password-error" data-error-required="Enter your password.">
            <button type="button" class="btn btn--secondary" data-password-toggle aria-controls="signin-password" aria-pressed="false" hidden>
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg> Show<span class="visually-hidden"> password</span>
            </button>
          </div>
          <p class="field__error" id="signin-password-error"></p>
        </div>

        <label class="choice">
          <input type="checkbox" name="remember" value="1">
          Keep me signed in on this device
        </label>

        <button type="submit" class="btn btn--block btn--lg">Sign in</button>
        <p class="alert alert--success" data-form-status hidden></p>
      </form>

      <p class="text-center text-muted">Don’t have an account? <a href="register.html">Create one</a></p>
    </div>
  </main>

  <footer class="auth__footer text-sm text-muted">
    <p>© 2026 Acme Cloud · <a href="#main">Privacy</a> · <a href="#main">Terms</a></p>
  </footer>
</body>
</html>
