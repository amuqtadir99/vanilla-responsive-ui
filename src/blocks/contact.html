<!--
@block: Contact
@category: Forms
@description: Contact section: contact details on one side and a validated enquiry form in a raised card on the other.
@css: blocks.css, components/form.css, components/button.css
@js: components/form-validation.js
@a11y: Labelled fields with autocomplete tokens, required markers explained in text, inline errors linked with aria-describedby and focus moved to the first error.
-->
<section data-block="contact" class="section" aria-labelledby="contact-title">
  <div class="container contact-split">
    <div class="stack">
      <p class="eyebrow">Contact</p>
      <h2 class="block-header__title" id="contact-title">Let’s build something together</h2>
      <p class="text-muted">Tell us about your project and we’ll reply within one business day.</p>
      <ul class="contact-points" role="list">
        <li><span class="block-icon"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h16a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"/><path d="m22 6-10 7L2 6"/></svg></span><span><strong>Email</strong><br><a href="mailto:hello@example.com">hello@example.com</a></span></li>
        <li><span class="block-icon"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6A19.79 19.79 0 0 1 2.12 4.18 2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/></svg></span><span><strong>Phone</strong><br><a href="tel:+15550100">+1 555 0100</a></span></li>
        <li><span class="block-icon"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg></span><span><strong>Studio</strong><br>12 Market Street, Springfield</span></li>
      </ul>
    </div>
    <form class="contact-form form" action="/contact" method="post" novalidate data-validate data-demo-submit>
      <p class="text-sm text-muted">All fields are required.</p>
      <div class="field">
        <label class="field__label" for="contact-block-name">Name</label>
        <input class="input" id="contact-block-name" name="name" type="text" autocomplete="name" required aria-describedby="contact-block-name-error">
        <p class="field__error" id="contact-block-name-error"></p>
      </div>
      <div class="field">
        <label class="field__label" for="contact-block-email">Work email</label>
        <input class="input" id="contact-block-email" name="email" type="email" autocomplete="email" required aria-describedby="contact-block-email-error">
        <p class="field__error" id="contact-block-email-error"></p>
      </div>
      <div class="field">
        <label class="field__label" for="contact-block-message">How can we help?</label>
        <textarea class="textarea" id="contact-block-message" name="message" rows="5" required aria-describedby="contact-block-message-error"></textarea>
        <p class="field__error" id="contact-block-message-error"></p>
      </div>
      <button type="submit" class="btn btn--block"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4z"/></svg> Send message</button>
      <p class="field__hint" role="status" data-form-status hidden>Thanks! We’ll be in touch shortly.</p>
    </form>
  </div>
</section>
