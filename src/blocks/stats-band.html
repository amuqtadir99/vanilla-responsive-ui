<!--
@block: Stats band
@category: Social proof
@description: Dark band with a short statement and four large figures. Uses the inverse theme, which stays readable in light and dark mode.
@css: blocks.css
@js: none
@a11y: Figures are a description list (dd value, dt label) so each number is announced with its meaning.
-->
<section data-block="stats-band" class="section section--inverse" aria-labelledby="stats-title">
  <div class="container">
    <div class="block-header">
      <p class="eyebrow">By the numbers</p>
      <h2 class="block-header__title" id="stats-title">Trusted in production by teams of every size</h2>
    </div>
    <dl class="stats">
      <div class="stats__item"><dt class="stats__label">Products launched</dt><dd class="stats__value">1,200+</dd></div>
      <div class="stats__item"><dt class="stats__label">Average Lighthouse score</dt><dd class="stats__value">98</dd></div>
      <div class="stats__item"><dt class="stats__label">Smaller than a typical UI kit</dt><dd class="stats__value">10×</dd></div>
      <div class="stats__item"><dt class="stats__label">Runtime dependencies</dt><dd class="stats__value">0</dd></div>
    </dl>
  </div>
</section>
