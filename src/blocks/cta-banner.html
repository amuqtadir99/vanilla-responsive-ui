<!--
@block: CTA banner
@category: Call to action
@description: Rounded call-to-action card on the brand gradient with a headline, supporting text and two buttons. Text colour follows the brand preset, so contrast holds for every theme.
@css: blocks.css, components/button.css
@js: none
@a11y: Buttons on the gradient use on-brand variants with AA contrast and a matching focus ring colour.
-->
<section data-block="cta-banner" class="section" aria-labelledby="cta-title">
  <div class="container">
    <div class="cta-banner">
      <div>
        <h2 class="cta-banner__title" id="cta-title">Ready to build something people love to use?</h2>
        <p class="cta-banner__text">Start free today. No credit card, no build step.</p>
      </div>
      <div class="cta-banner__actions">
        <a class="btn btn--lg btn--on-brand" href="/signup">Get started <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M12 5l7 7-7 7"/></svg></a>
        <a class="btn btn--lg btn--on-brand-outline" href="/contact">Talk to sales</a>
      </div>
    </div>
  </div>
</section>
